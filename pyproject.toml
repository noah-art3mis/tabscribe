[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabscribe"
version = "0.1.0"
description = "Transcribe recordings into editable guitar, bass and drum tabs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the core has no third-party dependencies

[project.optional-dependencies]
# Model-backed adapters. Only the ones named in your config are imported.
ml = [
  "demucs",
  "basic-pitch",
  "madmom @ git+https://github.com/CPJKU/madmom",
]
dev = ["pytest"]

[project.scripts]
tabscribe = "tabscribe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true  # madmom installs from git
